<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Iceland Itinerary 2026</title>
<style>
:root{
  /* 底色与文字 */
  --bg:#fafaf7; --surface:#fff; --surface-alt:#f6f5f1;
  --hotel-bg:#eef3f7; --meals-bg:#faf2e8; --opt-bg:#f2f1ec;
  --text:#1f1e1c; --muted:#5d5a53; --faint:#7f7b73; --line:#d5d1c7;
  /* 语义色 */
  --must:#b03a34; --interest:#6a4fa3; --paid:#b06430;
  --free:#2e7d55; --info:#2b6a94; --warn:#8a6a12;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.page{
  max-width:1160px; margin:0 auto; padding:0 20px;
  display:grid; grid-template-columns:252px minmax(0,1fr); gap:44px; align-items:start;
}
.content{min-width:0; padding:48px 0 72px}
/* 锚点跳转时给顶部留出余量 */
.day, .panel{scroll-margin-top:20px}

/* ---------- 左侧目录 ---------- */
.sidenav{
  position:sticky; top:0; align-self:start;
  max-height:100dvh; overflow-y:auto; overscroll-behavior:contain;
  padding:44px 4px 40px 0; font-size:13px;
}
.sidenav::-webkit-scrollbar{width:6px}
.sidenav::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
.nav-head{padding-bottom:16px; margin-bottom:6px; border-bottom:1px solid var(--line)}
.nav-title{font-size:15px; font-weight:700; letter-spacing:-.2px}
.nav-sub{font-size:12px; color:var(--faint); margin-top:2px}

.nav-sec{margin-top:14px}
.nav-sec-head{
  display:flex; align-items:center; gap:9px; width:100%; font:inherit; text-align:left;
  background:none; border:none; padding:6px 8px; cursor:pointer; color:var(--muted);
  border-radius:5px;
}
.nav-sec-head:hover{background:var(--surface-alt)}
.nav-sec-head:focus-visible{outline:2px solid var(--info); outline-offset:-2px}
.nav-num{font-size:11px; font-weight:700; color:var(--faint); font-variant-numeric:tabular-nums}
.nav-sec-name{font-size:12px; font-weight:700; letter-spacing:1.2px}
.nav-chev{margin-left:auto; font-size:14px; color:var(--faint); line-height:1}
.nav-list{display:flex; flex-direction:column; gap:1px; margin-top:4px}
.nav-list[hidden]{display:none}

.nav-day{
  display:flex; gap:9px; padding:7px 8px 7px 9px; border-radius:5px;
  text-decoration:none; color:inherit; border-left:2px solid transparent;
}
.nav-day:hover{background:var(--surface-alt)}
.nav-i{flex-shrink:0; font-size:11px; font-weight:700; color:var(--faint);
  font-variant-numeric:tabular-nums; padding-top:2px}
.nav-body{min-width:0; display:flex; flex-direction:column}
.nav-l1{font-size:13px; line-height:1.45; display:flex; align-items:center; gap:5px; flex-wrap:wrap}
.nav-l1 b{font-weight:700; color:var(--info); font-variant-numeric:tabular-nums}
.nav-l1 em{font-style:normal; font-size:11px; color:var(--faint)}
.nav-l2{font-size:11.5px; color:var(--faint); line-height:1.5; margin-top:1px}
.nav-pace{width:6px; height:6px; border-radius:50%; display:inline-block; flex-shrink:0}
.nav-easy{background:var(--free)}
.nav-mid{background:var(--warn)}
.nav-full{background:var(--must)}
.nav-aur{font-style:normal; color:var(--interest); margin-left:5px; font-size:11px}

.nav-ref{
  display:flex; align-items:center; gap:9px; padding:6px 8px 6px 9px; border-radius:5px;
  text-decoration:none; color:var(--muted); font-size:13px; border-left:2px solid transparent;
}
.nav-ref i{font-style:normal; width:16px; text-align:center; flex-shrink:0}
.nav-ref:hover{background:var(--surface-alt)}

/* 当前所在位置 */
.nav-day.on, .nav-ref.on{
  background:var(--surface-alt); border-left-color:var(--info); color:var(--text); font-weight:600;
}
.nav-day.on .nav-i, .nav-day.on .nav-l2{color:var(--muted)}

.nav-foot{
  margin-top:22px; padding-top:14px; border-top:1px solid var(--line);
  font-size:11.5px; color:var(--faint); line-height:2;
}
.nav-foot .nav-pace{margin-right:5px}

/* 手机：目录收进抽屉 */
.nav-fab, .nav-scrim{display:none}
@media(max-width:960px){
  .page{display:block; max-width:820px; padding:0 16px}
  .content{padding:60px 0 56px}
  .lang-toggle{top:10px; right:12px; padding:8px 14px}
  .day, .panel{scroll-margin-top:60px}
  .nav-fab{
    display:flex; align-items:center; gap:9px; position:fixed; z-index:40;
    top:10px; left:50%; transform:translateX(-50%);
    max-width:calc(100vw - 160px); font:inherit; font-size:13px; font-weight:600;
    color:var(--text); background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:8px 18px; cursor:pointer;
    box-shadow:0 2px 12px rgba(0,0,0,.09);
  }
  .nav-fab i{font-style:normal; color:var(--info)}
  .nav-fab span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .nav-scrim{display:block; position:fixed; inset:0; z-index:45; background:rgba(0,0,0,.28)}
  .nav-scrim[hidden]{display:none}
  .sidenav{
    position:fixed; z-index:50; top:0; left:0; bottom:0; width:288px; max-width:86vw;
    max-height:none; background:var(--surface); border-right:1px solid var(--line);
    padding:22px 14px 30px 16px; transform:translateX(-100%);
    transition:transform .22s ease; box-shadow:0 0 28px rgba(0,0,0,.12);
  }
  .sidenav.open{transform:none}
}
@media(prefers-reduced-motion:reduce){ .sidenav{transition:none} }

/* ---------- 页头 ---------- */
header{margin-bottom:40px; padding-bottom:24px; border-bottom:2px solid var(--text)}
header h1{font-size:30px; font-weight:600; letter-spacing:-.3px; margin-bottom:6px}
.subtitle{font-size:14px; color:var(--muted)}
.trip-dates{font-size:14px; color:var(--muted); margin-top:2px}
.daylight{display:flex; flex-wrap:wrap; gap:18px; margin-top:12px; font-size:13px; color:var(--faint)}

/* ---------- 一天 ---------- */
.day{margin-bottom:32px}
.day + .day{padding-top:30px; border-top:1px solid var(--line)}
.day-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px}
.day-date{font-size:17px; font-weight:700; color:var(--info); white-space:nowrap}
.day-name{font-size:19px; font-weight:600; letter-spacing:-.2px}
.day-index{font-size:12px; color:var(--faint); background:var(--surface-alt);
  border:1px solid var(--line); padding:1px 9px; border-radius:10px; white-space:nowrap}
.cat{font-size:12px; color:var(--paid); background:#f3e1d3;
  border:1px solid #e6d0b9; padding:1px 9px; border-radius:10px; white-space:nowrap; cursor:help}
.chore{font-size:12px; color:var(--info); background:#d9e7f1;
  border:1px solid #c2d7e6; padding:1px 9px; border-radius:10px; white-space:nowrap; cursor:help}
.day-dir{margin-left:auto; font-size:13px; color:var(--faint); white-space:nowrap}
.day-en{font-size:13px; color:var(--faint); margin-bottom:10px}
.day-summary{
  font-size:14px; color:var(--muted); margin-bottom:12px;
  padding:6px 12px; background:var(--surface-alt);
  border-left:3px solid var(--line); border-radius:0 4px 4px 0;
}
.day-summary strong{color:var(--text); font-weight:600}
.pace{font-size:12px; padding:1px 8px; border-radius:10px; margin-left:8px; font-weight:600}
.day-sun{
  display:flex; flex-wrap:wrap; gap:6px 16px; margin:-4px 0 14px;
  font-size:12.5px; color:var(--faint); line-height:1.5;
}
.day-sun b{font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums}
.day-sun em{font-style:normal; color:var(--warn); font-weight:600}
.pace-easy{background:#d9ebe1; color:var(--free)}
.pace-mid{background:#f1e5c9; color:var(--warn)}
.pace-full{background:#f4dcda; color:var(--must)}

/* ---------- 提示框 ---------- */
.callout{
  font-size:14px; line-height:1.65; padding:12px 16px;
  border-radius:6px; margin-bottom:12px;
}
.callout.note{background:#fbf6e8; border-left:3px solid var(--warn); color:#5d4a12}
.callout.warn{background:#fbeceb; border-left:3px solid var(--must); color:#7d2d28}

/* ---------- 停留点 ---------- */
.stops{list-style:none; display:flex; flex-direction:column; gap:2px}
.stop{
  display:flex; gap:16px; padding:12px 14px;
  background:var(--surface); border:1px solid var(--line); border-radius:6px;
}
.stop-time{
  flex-shrink:0; width:66px; text-align:right;
  font-size:14px; font-weight:600; font-variant-numeric:tabular-nums;
}
.stop-time span{display:block; font-size:12px; font-weight:400; color:var(--faint)}
.stop-main{flex:1; min-width:0}
.stop-name{font-size:15px; font-weight:600; margin-bottom:2px}
.stop-desc{font-size:14px; color:var(--muted); line-height:1.6}
.stop-tags{margin-top:6px; display:flex; flex-wrap:wrap; gap:6px}
/* 车程：卡片之间的一条虚线连接，不做卡片；顺路备选收在线下面 */
.leg{display:flex; gap:16px; padding:0 14px}
.leg-time{flex-shrink:0; width:66px; text-align:right; padding:7px 0; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums}
.leg-time span{display:block; font-size:11px}
.leg-main{flex:1; min-width:0; border-left:2px dashed var(--line); padding:6px 0 8px 14px}
.leg-line{display:flex; flex-wrap:wrap; align-items:baseline; gap:3px 10px; font-size:13px; color:var(--muted)}
.leg-line b{font-weight:600; color:var(--text); font-variant-numeric:tabular-nums}
.leg-ico{font-size:13px}
.leg-line .tag{font-size:11.5px}
.leg-desc{font-size:12.5px; color:var(--faint); line-height:1.6; margin-top:2px}
.leg-opts{margin-top:7px}
.leg-opts > summary{
  list-style:none; cursor:pointer; display:grid; grid-template-columns:auto 1fr auto; align-items:baseline; gap:4px 10px;
  padding:6px 10px; font-size:12.5px; color:var(--muted);
  background:var(--opt-bg); border:1px dashed var(--line); border-radius:6px;
}
.leg-opts > summary::-webkit-details-marker{display:none}
.leg-opts > summary b{font-weight:600; color:var(--muted); white-space:nowrap}
.leg-opts > summary .lo-names{color:var(--faint); min-width:0}
.leg-opts > summary::after{
  content:"展开 ▾"; font-size:12px; font-weight:600; color:var(--info); white-space:nowrap;
}
.leg-opts[open] > summary::after{content:"收起 ▴"}
.leg-opts > summary:hover{border-color:var(--faint)}
.leg-opts > summary:focus-visible{outline:2px solid var(--info); outline-offset:2px}
.leg-opts[open] > summary .lo-names{display:none}
.leg-opts ul{list-style:none; margin:6px 0 2px; padding:0; display:flex; flex-direction:column; gap:6px}
.leg-opts li{background:var(--opt-bg); border:1px dashed var(--line); border-radius:6px; padding:9px 12px}
.lo-name{font-size:13.5px; font-weight:600; color:var(--muted)}
.lo-name span{display:block; font-weight:400; font-size:12px; color:var(--faint); margin-top:1px}
.lo-desc{font-size:13px; color:var(--faint); line-height:1.6; margin-top:3px}

.tag{font-size:12px; padding:1px 8px; border-radius:4px; font-weight:500; white-space:nowrap}
.tag.must{background:#f4dcda; color:var(--must)}
.tag.interest{background:#e6dff2; color:var(--interest)}
.tag.paid{background:#f3e1d3; color:var(--paid)}
.tag.free{background:#d9ebe1; color:var(--free)}
.tag.drive{background:#e6e3dc; color:var(--muted)}
.tag.info{background:#d9e7f1; color:var(--info)}
.tag.booked{background:#d9ebe1; color:var(--free); font-weight:600}
.tag.dropped{background:#e6e3dc; color:var(--faint)}
.tag.flat{background:#d9ebe1; color:var(--free); font-weight:600}
.tag.noflat{background:#f1e5c9; color:var(--warn); font-weight:600}

/* 舱位 / 座椅说明 */
.cabin{
  margin-top:6px; padding:7px 11px; font-size:13px; line-height:1.65; color:var(--muted);
  background:var(--surface-alt); border-left:2px solid var(--line); border-radius:0 4px 4px 0;
}
.cabin strong{color:var(--text)}

/* ---------- 住宿卡 ---------- */
.hotel{
  margin-top:10px; padding:12px 16px;
  background:var(--hotel-bg); border:1px solid var(--line);
  border-left:3px solid var(--info); border-radius:0 6px 6px 0;
}
.hotel-name{font-size:15px; font-weight:600; margin-bottom:2px}
.hotel-when{font-size:13px; color:var(--muted)}
.hotel-detail{font-size:13px; color:var(--muted); margin-top:4px; line-height:1.6}
.aurora{font-size:12px; padding:1px 8px; border-radius:4px; margin-left:8px; font-weight:500; white-space:nowrap}
.aurora-best{background:#d9ebe1; color:var(--free)}
.aurora-ok{background:#f1e5c9; color:var(--warn)}
.aurora-none{background:#e6e3dc; color:var(--faint)}
.flag{font-size:12px; padding:1px 8px; border-radius:4px; margin-left:8px; font-weight:600; background:#f4dcda; color:var(--must)}
.ok{color:var(--free); font-weight:600}
.bad{color:var(--must); font-weight:600}

/* ---------- 每日用餐 ---------- */
.meals{
  margin-top:10px; padding:10px 16px;
  background:var(--meals-bg); border:1px solid var(--line);
  border-left:3px solid var(--paid); border-radius:0 6px 6px 0;
}
.meals-label{font-size:12px; color:var(--faint); letter-spacing:1px; font-weight:600; margin-bottom:5px}
.meal{display:flex; gap:9px; font-size:13px; line-height:1.65; padding:2px 0}
.meal-slot{flex-shrink:0; width:26px; font-weight:600; color:var(--paid)}
.meal-body{flex:1; min-width:0; color:var(--muted)}
.meal-body strong{color:var(--text); font-weight:600}
.meal-alt{color:var(--faint)}

/* ---------- 餐厅面板 ---------- */
.eat{display:flex; gap:12px; align-items:baseline; padding:8px 0; border-top:1px solid var(--line)}
.eat:first-of-type{border-top:none}
.group-label + .eat{border-top:none}
.eat-main{flex:1; min-width:0}
.eat-name{font-size:14px; font-weight:600}
.eat-meta{font-size:13px; color:var(--muted); line-height:1.6}
.eat-price{flex-shrink:0; font-size:13px; color:var(--muted); white-space:nowrap}
.eat-rate{font-size:12px; font-weight:700; color:var(--free); margin-left:7px}
.eat-rate.top{background:#d9ebe1; padding:1px 6px; border-radius:4px}
.eat-slot{
  font-size:12px; font-weight:600; white-space:nowrap; margin-right:7px;
  padding:1px 7px; border-radius:4px; background:#f3e1d3; color:var(--paid);
}

/* ---------- 每日路线地图（折叠，展开才加载）---------- */
.daymap{margin:-4px 0 14px; border:1px solid var(--line); border-radius:6px; background:var(--surface)}
.daymap > summary{
  list-style:none; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:8px 12px; cursor:pointer; font-size:13px; color:var(--muted); border-radius:6px;
}
.daymap > summary::-webkit-details-marker{display:none}
.daymap > summary::after{content:"展开"; margin-left:auto; font-size:12px; color:var(--info)}
.daymap[open] > summary::after{content:"收起"}
.daymap > summary:hover{background:var(--surface-alt)}
.daymap > summary:focus-visible{outline:2px solid var(--info); outline-offset:-2px}
.daymap-title{font-weight:600; color:var(--text)}
.stop-map{list-style:none; margin:6px 0}
.stop-map .daymap{margin:0}
.daymap-meta{font-size:12px; color:var(--faint)}
.daymap-body{padding:0 12px 12px}
.daymap-bar{display:flex; align-items:flex-start; gap:10px; margin-bottom:8px}
.daymap-chips{display:flex; flex-wrap:wrap; gap:6px; flex:1; min-width:0}
.daymap-chips button{
  font:inherit; font-size:12px; color:var(--muted); background:var(--surface-alt);
  border:1px solid var(--line); border-radius:999px; padding:3px 10px; cursor:pointer;
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
}
.daymap-chips button b{
  font-size:11px; width:16px; height:16px; border-radius:50%; display:inline-flex;
  align-items:center; justify-content:center; background:var(--line); color:var(--muted);
}
.daymap-chips button.tour{border-style:dashed}
.daymap-chips button:hover{border-color:var(--info)}
.daymap-chips button:focus-visible{outline:2px solid var(--info); outline-offset:2px}
.daymap-chips button.on{background:var(--info); border-color:var(--info); color:#fff}
.daymap-chips button.on b{background:#fff; color:var(--info)}
.daymap-open{
  flex-shrink:0; font-size:12px; font-weight:600; color:var(--info); text-decoration:none;
  border:1px solid var(--info); border-radius:5px; padding:4px 10px; white-space:nowrap;
}
.daymap-open:hover{background:var(--info); color:#fff}
.daymap-chips button.opt{border-style:dashed; background:transparent; color:var(--faint)}
.daymap-chips button.opt.on{background:var(--faint); border-color:var(--faint); color:#fff}
.daymap-links{display:flex; flex-direction:column; gap:6px; flex-shrink:0}
.daymap-open.alt{border-style:dashed; color:var(--muted); border-color:var(--faint)}
.daymap-open.alt:hover{background:var(--faint); border-color:var(--faint); color:#fff}
.daymap-frame{position:relative; border-radius:5px; overflow:hidden; background:var(--surface-alt); aspect-ratio:16/10}
.daymap-frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
@media(max-width:600px){
  .daymap-bar{flex-direction:column}
  .daymap-links{flex-direction:row; flex-wrap:wrap}
  .daymap-frame{aspect-ratio:4/5}
}

/* ---------- 面板（航班 / 住宿 / 地图 / 总览）---------- */
.panel{
  margin-top:32px; padding:24px;
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
}
.panel h2{font-size:19px; font-weight:600; margin-bottom:16px; letter-spacing:-.2px}
.panel-intro{font-size:14px; color:var(--muted); margin-bottom:16px}
.group-label{
  font-size:12px; color:var(--faint); letter-spacing:1px; font-weight:600;
  margin:20px 0 4px; padding-top:14px; border-top:1px solid var(--line);
}
.group-label:first-of-type{margin-top:0; padding-top:0; border-top:none}

/* 航班行 */
.flight{display:flex; gap:14px; align-items:flex-start; padding:10px 0}
.flight-no{flex-shrink:0; width:62px; font-size:14px; font-weight:700; color:var(--info)}
.flight-body{flex:1; min-width:0}
.flight-route{font-size:14px; font-weight:600; line-height:1.5}
.flight-route time{color:var(--muted); font-weight:400}
.flight-meta{font-size:13px; color:var(--muted); margin-top:2px}
.flight-dur{flex-shrink:0; font-size:13px; color:var(--faint); white-space:nowrap}
.layover{font-size:13px; color:var(--warn); padding:2px 0 8px 76px; font-style:italic}

/* 住宿行 */
.stay{display:flex; gap:14px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line)}
.stay:first-of-type{border-top:none}
.stay-date{flex-shrink:0; width:62px; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums}
.stay-date span{display:block; font-size:12px; font-weight:400; color:var(--faint)}
.stay-body{flex:1; min-width:0}
.stay-name{font-size:14px; font-weight:600}
.stay-addr{font-size:13px; color:var(--muted)}
.stay-detail{font-size:13px; color:var(--muted); margin-top:3px; line-height:1.6}

/* 总览四栏 */
.summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px}
.summary-label{font-size:12px; color:var(--faint); letter-spacing:1px; font-weight:600; margin-bottom:6px}
.summary-body{font-size:14px; line-height:1.9}

.legend{display:flex; flex-wrap:wrap; gap:16px; margin-top:22px; padding-top:18px; border-top:1px solid var(--line)}
.legend-item{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
.dot{width:9px; height:9px; border-radius:50%}

.privacy{margin-top:20px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--faint); line-height:1.7}

/* ---------- 打包清单 ---------- */
.layers{list-style:none; display:flex; flex-direction:column; gap:8px; font-size:14px}
.layers li{display:flex; gap:12px; align-items:baseline}
.layers b{flex-shrink:0; width:62px; color:var(--info)}
.prep-days{list-style:none; display:flex; flex-direction:column; gap:9px; font-size:14px}
.prep-days li{display:flex; gap:12px; align-items:baseline; line-height:1.6}
.prep-days time{flex-shrink:0; width:62px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--muted)}
.packlist{list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:0 24px}
.packlist label{display:flex; gap:9px; align-items:baseline; padding:5px 0; cursor:pointer; font-size:14px}
.packlist input{accent-color:var(--info); width:15px; height:15px; flex-shrink:0; margin:0}
.packlist input:focus-visible{outline:2px solid var(--info); outline-offset:2px}
.packlist .qty{margin-left:auto; color:var(--faint); font-size:13px; white-space:nowrap; padding-left:8px}
.packlist input:checked ~ .item{color:var(--faint); text-decoration:line-through}
.pack-count{font-size:13px; color:var(--faint); margin-top:10px}
@media(max-width:600px){ .packlist{grid-template-columns:1fr} .layers b,.prep-days time{width:auto} .layers li,.prep-days li{flex-direction:column; gap:2px} }

/* ---------- 版本戳 / 检查更新 ---------- */
.build-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:14px; font-size:12px; color:var(--faint)}
.build-bar button{font:inherit; color:var(--info); background:none;
  border:1px solid var(--line); border-radius:4px; padding:3px 10px; cursor:pointer}
.build-bar button:hover{background:var(--surface-alt)}
.build-bar button:focus-visible{outline:2px solid var(--info); outline-offset:2px}
#update-banner{margin-top:12px; padding:11px 15px; border-radius:6px; font-size:14px;
  background:#fbf6e8; border-left:3px solid var(--warn); color:#5d4a12}
#update-banner button{font:inherit; font-weight:600; color:#fff; background:var(--warn);
  border:none; border-radius:4px; padding:4px 12px; margin-left:8px; cursor:pointer}
#update-banner button:focus-visible{outline:2px solid var(--text); outline-offset:2px}

/* ---------- 景点图 ---------- */
.stop.has-ph{align-items:flex-start}
.ph{flex-shrink:0; width:92px; height:64px; padding:0; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--surface-alt); cursor:zoom-in}
.ph img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .2s}
.ph:hover img{transform:scale(1.05)}
.ph:focus-visible{outline:2px solid var(--info); outline-offset:2px}
.leg-opts li.has-ph{position:relative; padding-right:76px; min-height:66px}
.ph-sm{position:absolute; top:9px; right:10px; width:56px; height:48px; border-radius:5px}
.lightbox{position:fixed; inset:0; z-index:1000; background:rgba(20,19,17,.82); display:flex; align-items:center; justify-content:center; padding:20px}
.lightbox[hidden]{display:none}
.lb-box{position:relative; max-width:min(1100px,100%); max-height:100%; display:flex; flex-direction:column; background:var(--surface); border-radius:8px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.35)}
.lb-box img{display:block; max-width:100%; max-height:calc(100dvh - 110px); object-fit:contain; background:#111}
.lb-cap{padding:9px 14px; font-size:14px; display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline}
.lb-cap b{font-weight:600}
.lb-cap small{font-size:12px; color:var(--faint)}
.lb-cap a{color:var(--faint)}
.lb-close{position:absolute; top:8px; right:8px; width:34px; height:34px; border:0; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; font-size:20px; line-height:34px; cursor:pointer}
.lb-close:hover{background:rgba(0,0,0,.75)}
.lb-close:focus-visible{outline:2px solid #fff; outline-offset:2px}

/* ---------- 中英文切换 ---------- */
.lang-toggle{
  position:fixed; z-index:42; top:14px; right:16px;
  font:inherit; font-size:13px; font-weight:600; color:var(--text);
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:7px 15px; cursor:pointer; box-shadow:0 2px 12px rgba(0,0,0,.09);
}
.lang-toggle:hover{border-color:var(--faint)}
.lang-toggle:focus-visible{outline:2px solid var(--info); outline-offset:2px}
html[lang="en"] .leg-opts > summary::after{content:"Show ▾"}
html[lang="en"] .leg-opts[open] > summary::after{content:"Hide ▴"}
html[lang="en"] .daymap > summary::after{content:"Show"}
html[lang="en"] .daymap[open] > summary::after{content:"Hide"}
html[lang="en"] .meal-slot{width:66px}

/* ---------- 景点介绍（名字旁的 ? ） ---------- */
.qi{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; margin-left:6px; padding:0;
  vertical-align:1px; border:1px solid var(--line); border-radius:50%; background:var(--surface); color:var(--info);
  font-family:inherit; font-size:11px; font-weight:700; line-height:1; cursor:pointer}
.qi:hover{background:var(--info); border-color:var(--info); color:#fff}
.qi:focus-visible{outline:2px solid var(--info); outline-offset:2px}
.lo-name .qi{width:16px; height:16px; font-size:10px}
.intro{display:none}
.infobox{position:fixed; inset:0; z-index:1000; background:rgba(20,19,17,.55); display:flex; align-items:center; justify-content:center; padding:16px}
.infobox[hidden]{display:none}
.ib-card{position:relative; width:100%; max-width:460px; max-height:min(80vh, 640px); overflow:auto;
  background:var(--surface); color:var(--text); border-radius:10px; padding:20px 22px 18px; box-shadow:0 12px 40px rgba(0,0,0,.25)}
.ib-head h3{font-size:17px; font-weight:600; line-height:1.35; margin:0 32px 8px 0}
.ib-kind{display:inline-block; font-size:12px; font-weight:600; color:var(--muted); background:var(--surface-alt);
  border:1px solid var(--line); border-radius:10px; padding:1px 9px; margin-bottom:10px}
.ib-body p{font-size:14px; line-height:1.7; margin:0 0 10px}
.ib-body p:last-child{margin-bottom:0}
.ib-close{position:absolute; top:10px; right:10px; width:30px; height:30px; border:0; border-radius:50%;
  background:var(--surface-alt); color:var(--muted); font-size:18px; line-height:30px; cursor:pointer}
.ib-close:hover{color:var(--text)}
.ib-close:focus-visible{outline:2px solid var(--info); outline-offset:2px}

@media(max-width:600px){
  header h1{font-size:24px}
  .summary-grid{grid-template-columns:1fr}
  .stop{flex-direction:column; gap:6px}
  .stop-time{width:auto; text-align:left; display:flex; gap:8px; align-items:baseline}
  .stop-time span{display:inline}
  .stop.has-ph{position:relative; padding-right:86px; min-height:78px}
  .stop.has-ph .ph{position:absolute; top:12px; right:12px; width:64px; height:56px}
  .leg{gap:10px; padding:0 10px}
  .leg-time{width:44px; font-size:11px}
  .leg-opts > summary{grid-template-columns:1fr auto}
  .leg-opts > summary .lo-names{grid-column:1 / -1; grid-row:2}
  .eat{flex-direction:column; gap:2px}
  .eat-price{color:var(--faint)}
  .flight{flex-wrap:wrap}
  .flight-dur{width:100%; padding-left:76px}
  .layover{padding-left:0}
  .day-dir{margin-left:0; width:100%}
}
</style>

<script>
(function () {
  var gate = document.getElementById('gate');
  var form = document.getElementById('gate-form');
  var pw = document.getElementById('pw');
  var go = document.getElementById('go');
  var msg = document.getElementById('msg');
  var box = document.getElementById('content');
  var data = JSON.parse(document.getElementById('payload').textContent);
  var KEY = 'iceland-unlocked';
  var LANG = 'zh';
  try { LANG = localStorage.getItem('iceland-lang') === 'en' ? 'en' : 'zh'; } catch (e) {}
  if (LANG === 'en') {
    pw.placeholder = 'Password'; pw.setAttribute('aria-label', 'Password'); go.textContent = 'Enter';
  }

  function b64(s) {
    var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }

  function unlock(password) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64(data.s), iterations: data.n, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(data.i) }, key, b64(data.c));
      })
      .then(function (buf) {
        return new TextDecoder().decode(buf);
      });
  }

  function reveal(text) {
    var pages = JSON.parse(text), en = LANG === 'en';
    document.documentElement.lang = en ? 'en' : 'zh-CN';
    box.innerHTML = en ? pages.en : pages.zh;
    box.hidden = false;
    gate.remove();
    document.title = 'Iceland Itinerary 2026';
    initPage();
    // 切换语言后回到切换前看的那一段
    try {
      var p = JSON.parse(sessionStorage.getItem('iceland-pos') || 'null');
      sessionStorage.removeItem('iceland-pos');
      var el = p && document.getElementById(p.id);
      if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY + p.f * el.offsetHeight - 70);
    } catch (e) {}
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = pw.value;
    if (!v) return;
    go.disabled = true;
    msg.textContent = LANG === 'en' ? 'Unlocking…' : '解锁中…';
    unlock(v).then(function (html) {
      try { sessionStorage.setItem(KEY, v); } catch (err) {}
      reveal(html);
    }).catch(function () {
      go.disabled = false;
      msg.textContent = LANG === 'en' ? 'Wrong password, try again' : '密码不对，再试一次';
      pw.select();
    });
  });

  // 同一次会话里解锁过就不再问
  try {
    var saved = sessionStorage.getItem(KEY);
    if (saved) unlock(saved).then(reveal).catch(function () {
      try { sessionStorage.removeItem(KEY); } catch (e) {}
    });
  } catch (e) {}

  pw.focus();

  // ── 解锁后才挂载的页面行为（版本自检 + 打包清单）──
  function initPage() {

/* 界面文字按当前语言取：L('中文', 'English') */
function L(zh, en) { return document.documentElement.lang === 'en' ? en : zh; }

/* 版本自检：绕过缓存抓一份自己，比对 data-build，不同就提示载入新版。
   每次更新内容时，把 header 里 data-build 和它旁边显示的版本号一起改掉。 */
(function () {
  var bar = document.querySelector('.build-bar');
  if (!bar) return;
  var HERE = bar.getAttribute('data-build');
  var banner = document.getElementById('update-banner');
  var msg = document.getElementById('check-msg');
  var btn = document.getElementById('check-update');
  var reloadBtn = document.getElementById('do-reload');

  function freshUrl() {
    return location.pathname + '?v=' + Date.now();
  }
  function hardReload() {
    try { location.replace(freshUrl()); }
    catch (e) { location.reload(); }
  }
  if (reloadBtn) reloadBtn.addEventListener('click', hardReload);

  function check(loud) {
    if (loud && msg) msg.textContent = L('检查中…', 'Checking…');
    try {
      fetch(location.pathname + '?probe=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
        .then(function (t) {
          var m = t.match(/class="build-bar"\s+data-build="([^"]+)"/);
          if (m && m[1] !== HERE) {
            if (banner) banner.hidden = false;
            if (msg) msg.textContent = '';
          } else if (loud && msg) {
            msg.textContent = L('已是最新', 'Up to date');
            setTimeout(function () { msg.textContent = ''; }, 3000);
          }
        })
        .catch(function () {
          if (loud && msg) msg.textContent = L('查不到，直接点「载入新版」', 'Couldn’t check — tap “Load new version”');
          if (loud && banner) banner.hidden = false;
        });
    } catch (e) {
      if (loud && banner) banner.hidden = false;
    }
  }

  if (btn) btn.addEventListener('click', function () { check(true); });
  check(false);
})();

/* 左侧目录：滚动高亮当前位置、分组折叠、手机端抽屉。
   全部基于 data-target 与元素 id 配对，加减条目只要改 HTML，这段不用动。 */
(function () {
  var nav = document.getElementById('sidenav');
  if (!nav) return;
  var links = [].slice.call(nav.querySelectorAll('[data-target]'));
  var fab = document.getElementById('nav-fab');
  var fabNow = document.getElementById('nav-fab-now');
  var scrim = document.getElementById('nav-scrim');
  var mobile = function () { return window.matchMedia('(max-width:960px)').matches; };

  // id -> 链接，以及被观察的区块
  var map = {}, blocks = [];
  links.forEach(function (a) {
    var id = a.getAttribute('data-target');
    var el = document.getElementById(id);
    if (!el) return;
    map[id] = a;
    blocks.push({ id: id, el: el });
  });

  // ── 滚动高亮：取视口上沿之下最近的那个区块 ──
  var current = null;
  function spy() {
    var line = 90, best = blocks[0];
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].el.getBoundingClientRect().top <= line) best = blocks[i];
    }
    // 滚到底部时直接点亮最后一项，避免最后一节太短永远高亮不到
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) {
      best = blocks[blocks.length - 1];
    }
    if (!best || best.id === current) return;
    if (current && map[current]) map[current].classList.remove('on');
    current = best.id;
    map[current].classList.add('on');
    if (fabNow) {
      var l1 = map[current].querySelector('.nav-l1');
      fabNow.textContent = l1 ? l1.textContent.trim() : map[current].textContent.trim();
    }
    // 桌面端把高亮项滚进目录可视区
    if (!mobile()) {
      var r = map[current].getBoundingClientRect(), n = nav.getBoundingClientRect();
      if (r.top < n.top + 8 || r.bottom > n.bottom - 8) {
        map[current].scrollIntoView({ block: 'nearest' });
      }
    }
  }

  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { spy(); ticking = false; });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  spy();

  // ── 分组折叠 ──
  [].forEach.call(nav.querySelectorAll('.nav-sec-head'), function (btn) {
    btn.addEventListener('click', function () {
      var list = document.getElementById(btn.getAttribute('data-list'));
      if (!list) return;
      var open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      list.hidden = open;
      var chev = btn.querySelector('.nav-chev');
      if (chev) chev.textContent = open ? '+' : '−';
    });
  });

  // ── 手机端抽屉 ──
  function setDrawer(open) {
    nav.classList.toggle('open', open);
    if (scrim) scrim.hidden = !open;
    if (fab) fab.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  if (fab) fab.addEventListener('click', function () { setDrawer(!nav.classList.contains('open')); });
  if (scrim) scrim.addEventListener('click', function () { setDrawer(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && nav.classList.contains('open')) setDrawer(false);
  });
  links.forEach(function (a) {
    a.addEventListener('click', function () { if (mobile()) setDrawer(false); });
  });
})();

/* 每日路线地图：<details> 展开时才给 iframe 赋 src，避免一打开页面就加载 9 张地图；
   点标签切换「全天路线」和单个地点。 */
(function () {
  [].forEach.call(document.querySelectorAll('.daymap'), function (box) {
    var frame = box.querySelector('iframe');
    var chips = [].slice.call(box.querySelectorAll('.daymap-chips button'));
    if (!frame || !chips.length) return;
    function show(btn) {
      chips.forEach(function (b) { b.classList.toggle('on', b === btn); });
      var src = btn.getAttribute('data-src');
      if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
    }
    box.addEventListener('toggle', function () {
      if (box.open && !frame.getAttribute('src')) {
        show(box.querySelector('.daymap-chips button.on') || chips[0]);
      }
    });
    chips.forEach(function (b) { b.addEventListener('click', function () { show(b); }); });
  });
})();

/* 打包清单：勾选状态存 localStorage，按条目文字作 key，分几次打包也不会丢。
   沙箱里 storage 可能不可用，全部 try/catch，失败时清单照常能勾，只是不持久。 */
(function () {
  var list = document.getElementById('packlist');
  var out = document.getElementById('pack-count');
  if (!list) return;
  var boxes = list.querySelectorAll('input[type="checkbox"]');
  var KEY = 'iceland-pack-v1';

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { return {}; }
  }
  function save(state) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function labelOf(box) {
    var el = box.parentNode.querySelector('.item');
    return el ? (el.getAttribute('data-k') || el.textContent.trim()) : '';
  }
  function render() {
    var done = 0;
    for (var i = 0; i < boxes.length; i++) { if (boxes[i].checked) done++; }
    if (out) out.textContent = L('已备 ', 'Packed ') + done + ' / ' + boxes.length;
  }

  var state = load();
  for (var i = 0; i < boxes.length; i++) {
    var b = boxes[i];
    if (state[labelOf(b)]) b.checked = true;
    b.addEventListener('change', function () {
      var s = load();
      s[labelOf(this)] = this.checked;
      save(s);
      render();
    });
  }
  render();
})();
/* 景点图：点缩略图弹出大图，右上角 × / 点背景 / Esc 关闭 */
(function () {
  var lb = document.createElement('div');
  lb.className = 'lightbox'; lb.hidden = true;
  lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true');
  lb.innerHTML = '<div class="lb-box"><img alt=""><div class="lb-cap"><b></b><small></small></div>' +
                 '<button type="button" class="lb-close" aria-label="' + L('关闭', 'Close') + '">×</button></div>';
  document.body.appendChild(lb);
  var img = lb.querySelector('img'), title = lb.querySelector('.lb-cap b'),
      credit = lb.querySelector('.lb-cap small'), closeBtn = lb.querySelector('.lb-close'), last = null;
  function nameOf(btn) {
    var box = btn.closest('.stop, li');
    var n = box && box.querySelector('.stop-name, .lo-name');
    if (!n) return '';
    var t = n.firstChild && n.firstChild.nodeType === 3 ? n.firstChild.textContent : n.textContent;
    return t.trim();
  }
  function open(btn) {
    last = btn;
    img.src = 'img/' + btn.getAttribute('data-ph') + '.jpg';
    img.alt = title.textContent = nameOf(btn);
    credit.innerHTML = '';
    var src = btn.getAttribute('data-src');
    var who = btn.getAttribute('data-credit');
    if (who) credit.appendChild(document.createTextNode('📷 ' + who + (src ? ' · ' : '')));
    if (src) {
      var a = document.createElement('a');
      a.href = src; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Wikimedia Commons';
      credit.appendChild(a);
    }
    lb.hidden = false; document.documentElement.style.overflow = 'hidden'; closeBtn.focus();
  }
  function close() {
    lb.hidden = true; img.removeAttribute('src'); document.documentElement.style.overflow = '';
    if (last) last.focus();
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.ph');
    if (b) { e.preventDefault(); e.stopPropagation(); open(b); }
  });
  closeBtn.addEventListener('click', close);
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !lb.hidden) close(); });
})();
/* 中英文切换：记住语言和当前看到的位置，刷新后解锁脚本按语言载入正文（不用重新输密码） */
(function () {
  var en = document.documentElement.lang === 'en';
  var btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'lang-toggle';
  btn.textContent = en ? '中文' : 'EN';
  btn.setAttribute('aria-label', en ? '切换到中文' : 'Switch to English');
  document.body.appendChild(btn);
  btn.addEventListener('click', function () {
    var secs = document.querySelectorAll('.day, .panel'), cur = null;
    for (var i = 0; i < secs.length; i++) { if (secs[i].getBoundingClientRect().top <= 70) cur = secs[i]; }
    try {
      localStorage.setItem('iceland-lang', en ? 'zh' : 'en');
      if (cur) {
        var r = cur.getBoundingClientRect();
        sessionStorage.setItem('iceland-pos', JSON.stringify({ id: cur.id, f: (70 - r.top) / r.height }));
      }
    } catch (e) {}
    location.reload();
  });
})();

  });
  closeBtn.addEventListener('click', close);
  box.addEventListener('click', function (e) { if (e.target === box) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !box.hidden) close(); });
})();

  }
})();
